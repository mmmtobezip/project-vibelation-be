[project]
name = "vibelation-backend"
version = "0.1.0"
description = "VIBELATION REST API backend (scaffold)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<1.14",
    "httpx>=0.27,<0.28",
    "python-multipart>=0.0.12,<0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# pydantic 2.12 emits a spurious UnsupportedFieldAttributeWarning for every
# alias_generator-based CamelModel field; alias resolution itself works
# correctly (verified in tests/test_golden_path.py), this just silences noise.
filterwarnings = ["ignore::UserWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
